<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список бажань</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <h1>Список бажань</h1>
      <nav>
        <a href="#add-wish">Додати бажання</a>
        <a href="#wish-list">Список бажань</a>
        <a href="#total">Сума</a>
      </nav>
    </header>

    <div class="layout">
      <main>
        <section id="add-wish">
          <h2>Додати бажання</h2>
          <form id="wish-form">
            <label for="wish-name">Назва бажання:</label>
            <input type="text" id="wish-name" name="wish-name" required />

            <label for="wish-price">Ціна:</label>
            <input
              type="number"
              id="wish-price"
              name="wish-price"
              step="0.01"
              required
            />

            <label for="wish-priority">Пріоритет:</label>
            <select id="wish-priority" name="wish-priority">
              <option value="low">Низький</option>
              <option value="medium" selected>Середній</option>
              <option value="high">Високий</option>
            </select>

            <button type="submit">Додати</button>
          </form>
        </section>

        <section id="wish-list">
          <h2>Список бажань</h2>
          <div id="wish-items" class="cards">
            <article>
              <img
                src="https://content.rozetka.com.ua/goods/images/big/677460228.jpg"
                alt="Новий ноутбук"
              />
              <h3>Новий ноутбук</h3>
              <p>Ціна: 109999.00 грн</p>
            </article>

            <article>
              <img
                src="https://content.rozetka.com.ua/goods/images/big/595395804.jpg"
                alt="Навушники"
              />
              <h3>Навушники</h3>
              <p>Ціна: 3399.00 грн</p>
            </article>

            <article>
              <img
                src="https://work.njae.me.uk/content/images/size/w2000/2018/04/grokking-algorithms.png"
                alt="Книга з програмування"
              />
              <h3>Книга з програмування</h3>
              <p>Ціна: 1500.00 грн</p>
            </article>
          </div>
        </section>
      </main>

      <aside id="total">
        <h2>Сума</h2>
        <p id="total-amount">114898.00</p>
      </aside>
    </div>

    <footer>
      <p>&copy; 2026 КПІ. Усі права захищені.</p>
      <address>
        <p>
          Контакти:
          <a href="mailto:demuraevgenij562@gmail.com"
            >demuraevgenij562@gmail.com</a
          >,
          <a href="tel:+380997971565">+38 (099) 797-15-65</a>
        </p>
      </address>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
